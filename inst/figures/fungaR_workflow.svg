<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5791E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" fill="#FBF8F0"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#8A5A15">fungaR workflow</text>
  <text x="40" y="64" font-size="13" fill="#6b5638">Access and analyze Flora e Funga do Brasil fungal data, then help curate new records back into it</text>

  <!-- ============ STAGE 1: Access &amp; parse ============ -->
  <text x="40" y="100" font-size="14" font-weight="700" fill="#B5791E">1. ACCESS &amp; PARSE</text>

  <g font-size="13.5">
    <rect x="40" y="114" width="190" height="52" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="135" y="145" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_version()</text>

    <rect x="270" y="114" width="190" height="52" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="365" y="145" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_download()</text>

    <rect x="500" y="114" width="190" height="52" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="595" y="145" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_parse()</text>
  </g>

  <line x1="230" y1="140" x2="266" y2="140" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="140" x2="496" y2="140" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- connector: stage 1 -> stage 2 (jog well above the stage-2 header) -->
  <path d="M595,166 L595,180 L155,180 L155,224" fill="none" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M595,166 L595,180 L435,180 L435,224" fill="none" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 2: Explore &amp; filter ============ -->
  <text x="40" y="214" font-size="14" font-weight="700" fill="#B5791E">2. EXPLORE &amp; FILTER THE CHECKLIST</text>

  <g font-size="13.5">
    <rect x="40" y="228" width="230" height="58" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="155" y="254" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_records()</text>
    <text x="155" y="272" text-anchor="middle" fill="#8a7452" font-size="11">taxon / state / habitat / lifeForm</text>

    <rect x="310" y="228" width="250" height="58" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="435" y="254" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_get_children_taxa()</text>
    <text x="435" y="272" text-anchor="middle" fill="#8a7452" font-size="11">division / order / family / genus</text>
  </g>

  <!-- connector: stage 2 -> stage 3 (jog below stage-2 boxes, above stage-3 header) -->
  <path d="M435,286 L435,302 L135,302 L135,346" fill="none" stroke="#B5791E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 3: Resolve your own names ============ -->
  <text x="40" y="336" font-size="14" font-weight="700" fill="#B5791E">3. RESOLVE YOUR OWN NAME LIST</text>

  <g font-size="13.5">
    <rect x="40" y="350" width="190" height="52" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="135" y="381" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_search()</text>

    <rect x="270" y="350" width="190" height="52" rx="10" fill="#FCF3DE" stroke="#E0A22B" stroke-width="1.5"/>
    <text x="365" y="381" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_match()</text>
  </g>

  <line x1="230" y1="376" x2="266" y2="376" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 4: Curate new records (highlighted) ============ -->
  <rect x="720" y="90" width="420" height="380" rx="16" fill="#FBEAC0" stroke="#B5791E" stroke-width="2.5"/>
  <text x="740" y="120" font-size="14" font-weight="700" fill="#7A4A18">4. CURATE NEW RECORDS FOR FFB</text>
  <text x="740" y="138" font-size="11" fill="#7A4A18">for taxonomic experts contributing to the platform</text>

  <g font-size="13.5">
    <rect x="740" y="156" width="380" height="86" rx="10" fill="#FFFFFF" stroke="#B5791E" stroke-width="1.5"/>
    <text x="930" y="182" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_mycobank_gap()</text>
    <text x="930" y="200" text-anchor="middle" fill="#7a6a4a" font-size="11">MycoBank names missing from FFB,</text>
    <text x="930" y="215" text-anchor="middle" fill="#7a6a4a" font-size="11">cross-checked for Brazil evidence (GBIF / speciesLink)</text>

    <rect x="740" y="264" width="380" height="86" rx="10" fill="#FFFFFF" stroke="#B5791E" stroke-width="1.5"/>
    <text x="930" y="290" text-anchor="middle" fill="#8A5A15" font-weight="600">funga_distribution_gap()</text>
    <text x="930" y="308" text-anchor="middle" fill="#7a6a4a" font-size="11">Brazilian states with specimen evidence</text>
    <text x="930" y="323" text-anchor="middle" fill="#7a6a4a" font-size="11">(GBIF / speciesLink / REFLORA) absent from FFB</text>

    <rect x="820" y="386" width="220" height="60" rx="10" fill="#B5791E"/>
    <text x="930" y="412" text-anchor="middle" fill="#FFF8E8" font-weight="700">Taxonomist review</text>
    <text x="930" y="430" text-anchor="middle" fill="#FFF8E8" font-size="11">&#8594; new records into FFB</text>
  </g>

  <line x1="930" y1="242" x2="930" y2="260" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="350" x2="930" y2="382" stroke="#B5791E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- connectors: stage 2 boxes' right edge -> stage 4 boxes (curves start exactly on the box border) -->
  <path d="M560,257 C 650,257 690,199 736,199" fill="none" stroke="#B5791E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <path d="M560,257 C 650,257 690,307 736,307" fill="none" stroke="#B5791E" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Footer: legend + note, well below every box (left column ends y=402, right box ends y=470) -->
  <g font-size="11.5" fill="#6b5638">
    <rect x="40" y="500" width="14" height="14" fill="#FCF3DE" stroke="#E0A22B"/>
    <text x="60" y="511">Access, explore, and resolve names (Steps 1-3)</text>
    <rect x="380" y="500" width="14" height="14" fill="#FBEAC0" stroke="#B5791E"/>
    <text x="400" y="511">Fungi-specific curation tools (new in fungaR)</text>
  </g>

  <text x="40" y="546" font-size="12" fill="#8a7a5a">Most functions in Steps 1-3 download and parse the FFB dataset automatically and cache it locally,</text>
  <text x="40" y="564" font-size="12" fill="#8a7a5a">so funga_download()/funga_parse() rarely need to be called directly.</text>
</svg>
